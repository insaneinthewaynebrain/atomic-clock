<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atomic Clock">
  <meta name="description" content="Network-synced clock for setting mechanical watches, with watch accuracy tracker, world clock, weather and currency.">
  <title>Atomic Clock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app">
    <!-- CLOCK -->
    <section class="tab active" id="tab-clock" data-tab="clock">
      <header class="topbar">
        <h1>Atomic Clock</h1>
      </header>

      <div class="clock-layout">
        <div class="clock-pane">
          <button id="sync-status" class="sync-status" type="button" aria-live="polite">
            <span class="dot"></span><span class="sync-text">Syncing with network time…</span>
          </button>
          <div id="sync-detail" class="sync-detail"></div>

          <div class="clock" aria-label="Current time">
            <div class="now-row">
              <span class="now-label">Time now</span>
              <span class="clk-now"><span id="clk-hm">--:--</span>:<span id="clk-s">--</span><span class="clk-ms" id="clk-ms">.---</span></span>
            </div>
            <div class="clk-date" id="clk-date"></div>
            <div class="clk-tz" id="clk-tz"></div>
            <div id="zone-slot"></div>
            <div id="countdown-slot"></div>
            <div id="settime-slot"></div>
            <div class="clk-wake" id="clk-wake"></div>
          </div>
        </div>
        <div class="tracker-pane">
          <div class="card" id="tracker"></div>
          <div class="footer-links"><button type="button" id="backup-link" class="link-btn">Backup &amp; restore</button></div>
        </div>
      </div>
    </section>

    <!-- WATCH BOX (internal id stays "collection" so saved data and links keep working) -->
    <section class="tab" id="tab-collection" data-tab="collection">
      <header class="topbar"><h1>Watch Box</h1><button type="button" id="box-lock" class="icon-btn pad-btn" aria-label="Watch Box lock">🔒</button></header>
      <div id="collection"></div>
    </section>

    <!-- TOOLS -->
    <section class="tab" id="tab-tools" data-tab="tools">
      <header class="topbar">
        <button type="button" id="tools-back" class="back-btn" hidden>‹ Tools</button>
        <h1 id="tools-title">Tools</h1>
      </header>
      <div id="tools-home"></div>

      <div class="tool-panel" data-tool="world" hidden>
        <div id="world-local" class="world-local"></div>
        <div class="list" id="world-fixed"></div>
        <h2 class="section-title">My places <span class="muted small">tap a slot to change it</span></h2>
        <div class="list" id="world-slots"></div>
      </div>
      <div class="tool-panel" data-tool="weather" hidden><div id="weather"></div></div>
      <div class="tool-panel" data-tool="currency" hidden><div id="currency"></div></div>
      <div class="tool-panel" data-tool="setting" hidden><div id="tool-setting-body"></div></div>
      <div class="tool-panel" data-tool="alarm" hidden><div id="tool-alarm-body"></div></div>
      <div class="tool-panel" data-tool="moon" hidden><div id="tool-moon-body"></div></div>
      <div class="tool-panel" data-tool="gmt" hidden><div id="tool-gmt-body"></div></div>
      <div class="tool-panel" data-tool="timegrapher" hidden><div id="tool-timegrapher-body"></div></div>
      <div class="tool-panel" data-tool="insurance" hidden><div id="tool-insurance-body"></div></div>
      <div class="tool-panel" data-tool="settings" hidden><div id="tool-settings-body"></div></div>
      <div class="tool-panel" data-tool="about" hidden><div id="tool-about-body"></div></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tabbtn active" data-tab="clock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span>Clock</span>
    </button>
    <button type="button" class="tabbtn" data-tab="collection">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 8.5 5 4.5h14l2 4"/><circle cx="12" cy="14.5" r="3"/><path d="M12 13.2v1.3l.9.6"/></svg>
      <span>Watch Box</span><i class="tab-badge" hidden></i>
    </button>
    <button type="button" class="tabbtn" data-tab="tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.1L4 16.8 7.2 20l5.2-5.2a4 4 0 0 0 5.1-5.3l-2.4 2.4-2.6-.5-.5-2.6z"/></svg>
      <span>Tools</span>
    </button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
